# Contexto http {} — não coloque isto dentro de server {}.
# local = gateway neste Zabbix server. Qualquer outro slug vira hostname:9100
# (DNS ou /etc/hosts no server). Override explícito: topovision-console.backends.

map $console_slug $topovision_console_pass {
    default $console_slug:9100;
    local   127.0.0.1:9100;
    include /etc/nginx/topovision-console.backends;
}
