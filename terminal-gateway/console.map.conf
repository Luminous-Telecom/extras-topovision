# Contexto http {} — não coloque isto dentro de server {}.
# O slug sai da URI. Regex entre aspas: {n,m} no map o nginx lê como bloco.
# local = gateway neste server. Outro slug = hostname:9100 (DNS ou /etc/hosts).
# Override: /etc/nginx/topovision-console.backends (slug  ip:9100;).

map $uri $topovision_console_slug {
    default "";
    "~^/console/([A-Za-z0-9._-]+)"  $1;
}

map $topovision_console_slug $topovision_console_pass {
    default $topovision_console_slug:9100;
    local   127.0.0.1:9100;
    include /etc/nginx/topovision-console.backends;
}
